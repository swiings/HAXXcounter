; HAXXcounter — passive WiFi probe + BLE people counter
; Target: Waveshare ESP32-S3-Touch-AMOLED-1.8
;   Chip:  ESP32-S3R8 @ 240 MHz
;   Flash: 16 MB QIO
;   PSRAM: 8 MB OPI (stacked)

[env:haxxcounter]
platform           = espressif32
framework          = arduino
board              = esp32-s3-devkitc-1
monitor_speed      = 115200
upload_speed       = 921600

; ---- chip / memory --------------------------------------------------------
board_build.mcu                 = esp32s3
board_build.f_cpu               = 240000000L
board_build.f_flash             = 80000000L
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv

; ---- build flags ----------------------------------------------------------
extra_scripts = pre:scripts/add_includes.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL: lv_conf.h resolved via add_includes.py adding include/ to CPPPATH
    -DLV_CONF_INCLUDE_SIMPLE
    ; NimBLE coexistence with WiFi
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    ; Suppress Arduino HAL log_e() noise (esp32-hal-i2c-ng, Wire) — our own
    ; Serial.printf calls are unaffected; this only silences framework log_e macros
    -DCORE_DEBUG_LEVEL=0

; ---- library dependencies -------------------------------------------------
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.5.6
    lvgl/lvgl                           @ ^8.4.0
    h2zero/NimBLE-Arduino               @ ^2.1.0
    lewisxhe/XPowersLib                 @ ^0.2.6
